server {
    # Listen on port 8080 (the default port Azure exposes inside the container)
    listen 8080;
    listen [::]:8080;
    root /home/site/wwwroot;
    index index.php index.html index.htm;
    server_name _;
    port_in_redirect off;

    # Force HTTPS (Cloudflare and Azure pass X-Forwarded-Proto)
    if ($http_x_forwarded_proto = "http") {
        return 301 https://$host$request_uri;
    }

    # Redirect parents portal
    rewrite ^/parents(\.php|\.html|/?)?$ /parents-redirect.html permanent;

    # Custom Error Pages
    error_page 403 /403.html;
    error_page 404 /404.html;
    error_page 500 502 503 504 /500.html;

    # Block direct access to events.json
    location = /events.json {
        deny all;
    }

    # Main routing
    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    # Standard PHP-FPM configuration for Azure Linux
    location ~ \.php$ {
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }
}
