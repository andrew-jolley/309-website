name: Deploy Public Website to Azure

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Inject Build Number
        run: |
          BUILD_DATE=$(TZ='Europe/London' date +'%y%m%d')
          sed -i "s/__BUILD_DATE__/$BUILD_DATE/g" index.html
          sed -i "s/__BUILD_NUMBER__/${{ github.run_number }}/g" index.html

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v2
        with:
          app-name: '309-website-public' # Update this to match what you name it in Azure
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: .
