name: Deploy Website

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Create zip
        run: zip -r site.zip . -x "*.git*"

      - name: Upload zip
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./
          include: site.zip
          server-dir: /309aircadets.co.uk/htdocs/

      - name: Trigger deploy
        run: curl https://309aircadets.co.uk/deploy.php