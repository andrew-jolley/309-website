name: Deploy Website

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Create zip
      - name: Create zip
        run: |
          mkdir deploy
          zip -r deploy/site.zip . \
            -x "*.git*" \
            -x "deploy/*"

      # Upload ONLY deploy folder
      - name: Upload zip
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./deploy/
          server-dir: /309aircadets.co.uk/htdocs/
          dangerous-clean-slate: false

      # Extract on server
      - name: Trigger deploy
        run: curl https://309aircadets.co.uk/deploy.php