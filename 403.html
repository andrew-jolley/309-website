<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>403 - Forbidden</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        html { visibility: hidden; }
        body { font-family: 'Inter', system-ui, sans-serif; }
    </style>
    <script>
        window.addEventListener('load', function() {
            document.documentElement.style.visibility = 'visible';
        });
    </script>
</head>
<body class="bg-gray-50 flex items-center justify-center h-screen antialiased">
    <div class="text-center px-4">
        <h1 class="text-9xl font-extrabold text-blue-900">403</h1>
        <p class="text-2xl md:text-3xl font-light text-gray-600 mt-4">Access Denied.</p>
        <p class="text-gray-500 mt-2 mb-8">You don't have permission to access this resource.</p>
        <a href="/" class="px-6 py-3 bg-blue-600 text-white font-semibold rounded-lg shadow-md hover:bg-blue-700 transition">Go to Homepage</a>
    </div>
</body>
</html>
